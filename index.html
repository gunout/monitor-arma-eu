function exportDatasetPDF(d){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFillColor(0, 87, 183);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setFillColor(255, 215, 0);
  doc.rect(0, 30, 210, 3, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16);
  doc.setFont('helvetica', 'bold');
  doc.text('Монітор АРМА', 14, 15);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text('Звіт експертизи — ' + new Date().toLocaleString('uk-UA'), 14, 22);

  doc.setTextColor(30, 30, 30);
  let y = 45;
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  const title = getTitle(d);
  const titleLines = doc.splitTextToSize(title, 180);
  doc.text(titleLines, 14, y);
  y += titleLines.length * 7 + 6;

  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text(`Організація : ${getOrg(d) || '—'}`, 14, y); y += 6;
  doc.text(`ID : ${d.id}`, 14, y); y += 6;
  doc.text(`Оновлено : ${formatDate(d.last_update)}`, 14, y); y += 6;
  doc.text(`Оцінка : ${datasetScore(d)}/100`, 14, y); y += 10;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.text('Опис', 14, y); y += 6;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  const desc = d.description || 'Опис відсутній';
  const descLines = doc.splitTextToSize(desc, 180);
  doc.text(descLines.slice(0, 15), 14, y);
  y += Math.min(descLines.length, 15) * 4.5 + 8;

  if (state.expertiseCache.size){
    doc.addPage();
    y = 20;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text('Звіти аналізу', 14, y); y += 10;

    state.expertiseCache.forEach((a, resKey) => {
      if (y > 250){ doc.addPage(); y = 20; }
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.text(`• ${(a.title || resKey).slice(0, 60)}`, 14, y); y += 6;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      if (a.error){
        doc.setTextColor(200, 16, 46);
        doc.text(`Помилка : ${a.error}`, 18, y); y += 6;
        doc.setTextColor(30, 30, 30);
      } else if (a.isARMAPassport && a.armaPassport){
        doc.text(`Тип : Паспорт бюджетної програми`, 18, y); y += 5;
        doc.text(`Секцій : ${a.armaPassport.rawSections.length}`, 18, y); y += 5;
        if (a.armaPassport.budget?.total){
          const t = a.armaPassport.budget.total;
          doc.text(`Бюджет : План=${(t.plan_razom/1e3).toFixed(1)} тис ₴ · Факт=${(t.fakt_razom/1e3).toFixed(1)} тис ₴ · Вик.=${t.taux.toFixed(1)}%`, 18, y); y += 5;
        }
        const totalInd = a.armaPassport.indicators.zatrat.length + a.armaPassport.indicators.produktu.length + a.armaPassport.indicators.efektyvnosti.length + a.armaPassport.indicators.yakosti.length;
        doc.text(`Показників : ${totalInd}`, 18, y); y += 5;
      } else {
        doc.text(`Формат : ${a.format.toUpperCase()} · Розмір : ${formatBytes(a.stats.size)}`, 18, y); y += 5;
        doc.text(`Рядків : ${a.stats.rows || '—'} · Колонок : ${a.stats.columns || '—'}`, 18, y); y += 5;
      }
      y += 3;
    });
  }

  const totalPages = doc.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(120, 120, 120);
    doc.text(`Стор. ${i} / ${totalPages} — Монітор АРМА`, 14, 290);
  }

  doc.save(`zvit_arma_${d.id}.pdf`);
  showToast('📄 PDF сформовано', 'success');
}

async function analyzeAll(){
  const targets = state.currentPageItems || state.datasets.slice(0, 25);
  showToast(`🔬 Аналіз ${targets.length} наборів…`);
  let processed = 0;
  for (const d of targets){
    const resources = getResources(d);
    for (let idx = 0; idx < resources.length; idx++){
      const resKey = `${d.id}::${idx}`;
      if (state.expertiseCache.has(resKey)) continue;
      await analyzeResource(resources[idx], resKey);
      processed++;
    }
  }
  updateCacheInfo();
  showToast(`✅ Проаналізовано ${processed} ресурсів`, 'success');
  if (state.selectedDataset) renderExpertiseView();
}

function updateCacheInfo(){
  document.getElementById('ivCache').textContent = state.expertiseCache.size;
}

function addToHistory(action){
  state.history.unshift({ action, time: new Date() });
  state.history = state.history.slice(0, 10);
  const el = document.getElementById('historyPanel');
  if (!el) return;
  el.innerHTML = state.history.map(h => `
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px;
                border-bottom:1px solid var(--grey-100)">
      <span>${escapeHtml(h.action)}</span>
      <span style="color:var(--grey-500);font-family:var(--font-mono);font-size:10px">
        ${h.time.toLocaleTimeString('uk-UA', {hour:'2-digit',minute:'2-digit'})}
      </span>
    </div>
  `).join('');
}

// ====================================================================
// PAGINATION
// ====================================================================
function updatePaginationUI(totalPages, current){
  document.getElementById('paginationInfo').innerHTML =
    `<strong>${state.totalResults.toLocaleString('uk-UA')}</strong> результатів · стор. <strong>${current}</strong> / ${totalPages}`;
  document.getElementById('pageInput').value = current;
  document.getElementById('pageInput').max = totalPages;
  document.getElementById('pageTotal').textContent = `/ ${totalPages}`;
  document.getElementById('pageFirst').disabled = current <= 1;
  document.getElementById('pagePrev').disabled = current <= 1;
  document.getElementById('pageNext').disabled = current >= totalPages;
  document.getElementById('pageLast').disabled = current >= totalPages;
  document.getElementById('paginationBar').hidden = false;
}
function goToPage(p){
  const totalPages = Math.max(1, Math.ceil(state.totalResults / state.pageSize));
  runSearch(Math.max(1, Math.min(totalPages, p)));
}
document.getElementById('pageFirst').addEventListener('click', () => goToPage(1));
document.getElementById('pagePrev').addEventListener('click', () => goToPage(state.currentPage - 1));
document.getElementById('pageNext').addEventListener('click', () => goToPage(state.currentPage + 1));
document.getElementById('pageLast').addEventListener('click', () => goToPage(Math.ceil(state.totalResults / state.pageSize)));
document.getElementById('pageInput').addEventListener('change', (e) => goToPage(parseInt(e.target.value)||1));
document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
  state.pageSize = parseInt(e.target.value);
  runSearch(1);
});

document.querySelectorAll('.view-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.currentView = t.dataset.view;
    if (state.currentView === 'expert') renderExpertiseView();
    else if (state.currentView === 'alerts') renderAlertsView();
    else if (state.currentView === 'pii') renderPIIView();
    else runSearch(state.currentPage);
  });
});

document.getElementById('searchBtn').addEventListener('click', () => runSearch(1));
document.getElementById('queryInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') runSearch(1); });
document.getElementById('sortSelect').addEventListener('change', () => runSearch(1));
document.getElementById('sourceSearch').addEventListener('input', renderCategories);

document.getElementById('analyzeAll').addEventListener('click', analyzeAll);
document.getElementById('runSurveillance').addEventListener('click', () => {
  state.currentView = 'alerts';
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'alerts'));
  renderAlertsView();
  addToHistory('Запуск моніторингу');
});
document.getElementById('scanPII').addEventListener('click', () => {
  state.currentView = 'pii';
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'pii'));
  renderPIIView();
  addToHistory('Скан PII');
});

document.addEventListener('DOMContentLoaded', () => {
  loadData();
  updateCacheInfo();
});
</script>
